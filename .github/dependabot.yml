version: 2
updates:
  # Version bumps stay manual (batches), so the limit is 0: this entry only lets
  # security updates edit bun.lock instead of failing on the npm_and_yarn default.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(deps)"
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    # One label per PR; the default adds an ecosystem label too.
    labels: ["dependencies"]

  # The Dockerfile's base images are pinned by digest; this is what un-freezes them.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies"]
