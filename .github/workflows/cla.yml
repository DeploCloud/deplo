name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: read

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only this job writes, and only what the bot needs to comment, set a status and
    # commit the signature file.
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # pull_request_target runs with write access, so the action is pinned to a commit,
      # not a tag: upstream is archived and a tag can still be moved.
      - name: Check the contributor has signed the CLA
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/DeploCloud/deplo/blob/main/CLA.md"
          path-to-signatures: "signatures/version1/cla.json"
          branch: "main"
          allowlist: "IdraDev,bot*,dependabot[bot]"
          create-file-commit-message: "chore(cla): create the signature file"
          signed-commit-message: "chore(cla): $contributorName signed the CLA"
          custom-notsigned-prcomment: "Thanks for the pull request. Deplo is AGPL-3.0-only and DeploCloud also offers it under commercial terms, so a contribution has to arrive with the right to do both. Please read the [CLA](https://github.com/DeploCloud/deplo/blob/main/CLA.md) - it is a license grant, not a copyright assignment, you keep what you wrote - then post the sentence below as a comment. Once per person, and it covers everything you have contributed before today too."
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA."
          lock-pullrequest-aftermerge: false
