name: Docker image

on:
  push:
    tags:
      - "v*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository owner to lowercase
        id: repo_owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and push Docker images
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/${{ github.event.repository.name }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Keyless: the signature is bound to this workflow's OIDC identity, so there
      # is no private key to store or rotate. Signing the digest covers every tag.
      - name: Sign the image
        env:
          IMAGE: ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/${{ github.event.repository.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # LAST, not first. Publishing the release before the build meant a failed
      # build still announced a version: v1.1.0 has a release page and no image
      # behind it, so `install.sh` on that version pulls a tag that was never
      # pushed. A release now means an image exists.
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
