name: CI

on:
  push:
    branches: ["main"]
    # The CLA bot commits a signature here on every new contributor. Nothing in
    # lint, tests or tsc can see that file.
    paths-ignore: [".github/cla/**"]
  pull_request:
  # So a newly-published advisory turns the repo red on its own, without waiting
  # for somebody to push. Only the audit and the agent contract can find work on
  # code that has not changed, so they are all it runs.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# The default GITHUB_TOKEN can write to the repository. Nothing here needs that:
# lint, tests, audit and typecheck only read the checkout. A pull request from a
# fork gets no secrets either way, but a compromised action in the tree would.
permissions:
  contents: read

# A second push to the same branch cancels the first: nobody reads the result of
# a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A merge whose tree a pull request already tested green has nothing new to check.
  tested:
    name: Already tested
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.pr.outputs.skip }}
    steps:
      - id: pr
        if: github.event_name == 'push'
        # A failure here runs every check, never skips one.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
          tree=$(api "commits/$GITHUB_SHA" .commit.tree.sha)
          skip=false
          # The head held all of main and is this exact tree, so the pull request's run tested this commit.
          for head in $(api "commits/$GITHUB_SHA/pulls" '.[] | select(.merged_at) | .head.sha'); do
            [ "$(api "compare/$BEFORE...$head" .behind_by)" = 0 ] || continue
            [ "$(api "commits/$head" .commit.tree.sha)" = "$tree" ] || continue
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event pull_request --commit "$head" --status success --limit 1 --json databaseId --jq '.[].databaseId')
            [ -n "$run" ] || continue
            echo "::notice::pull request run $run already tested this tree green"
            skip=true
          done
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: tested
    if: github.event_name != 'schedule' && needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # The pre-commit hook formats what is staged, so this only ever fires for a
      # commit made with --no-verify or from a checkout that never ran `bun
      # install`. It is the backstop, not the mechanism.
      - run: bun run format:check

  test:
    name: Tests
    needs: tested
    if: github.event_name != 'schedule' && needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # The suite runs in-process against pglite and takes ~15 minutes on a decent
    # box; a hosted runner is slower. The cap is a runaway guard, not a target,
    # so it is set well clear of the real number rather than close to it - a
    # timeout that trips is a red build that says nothing about the code.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run the suite
        # DEPLO_DATABASE_URL must stay UNSET. The suite runs in-process against
        # pglite (`makeTestDb` + `__setTestDb`); with a real URL exported, the
        # lease/scheduler tests bind to that database instead and fail. There is
        # no Postgres service container here on purpose.
        env:
          DEPLO_SECRET: ci-test-secret-not-used-for-anything-real
        run: bun run test

  audit:
    name: Dependency audit
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Fail on a high-severity advisory
        # Only `high` and above break the build. Moderate advisories in
        # build-time-only tooling (postcss, esbuild, the eslint dependency tree)
        # would otherwise make this job permanently red, and a check that is
        # always red is a check nobody reads.
        run: bun audit --audit-level=high

  typecheck:
    name: Types
    needs: tested
    if: github.event_name != 'schedule' && needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # `PageProps` / `LayoutProps` / `RouteContext` are GENERATED globals: Next
      # writes them into `.next/types`, which `tsconfig.json` includes. They exist
      # on any machine that has run the dev server or a build, and on a fresh
      # checkout they do not - so tsc alone reported ~65 phantom "Cannot find
      # name" errors here while every developer's local run was green.
      #
      # `typegen` is the subcommand for exactly this: it emits those definitions
      # WITHOUT a build, so this job stays seconds rather than minutes. It also
      # needs no environment - unlike `next build`, which loads the app and
      # fail-fasts on a missing DEPLO_DATABASE_URL (lib/db/pg.ts).
      - run: bunx next typegen
      - run: bunx tsc --noEmit
      # schema.graphql is generated, and the MCP tool test and the API docs both read it.
      - run: bun run gen:schema && git diff --exit-code lib/graphql/schema.graphql

  # The answers' routes are a contract with the server agent (docs/agents/cluster-rollout.md §7). The agent changes
  # first, so this repo's reference must be the agent's, and what it renders must pass the agent release this panel
  # pins, which is what its servers run.
  answer-contract:
    name: Answer contract
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DeploCloud/deplo-agent
          path: deplo-agent
          fetch-depth: 0
      - name: The reference is the agent's
        run: |
          diff <(jq -S . lib/deploy/answer-routes.golden.json) <(jq -S . deplo-agent/internal/server/testdata/answer-routes.golden.json) || {
            echo "::error::lib/deploy/answer-routes.golden.json differs from deplo-agent's internal/server/testdata/answer-routes.golden.json"
            exit 1
          }
          # The cluster's DNS zone (ADR-0049): the request Deplo renders, as the agent checks it.
          if [ -f deplo-agent/internal/server/testdata/cluster-zone.golden.json ]; then
            diff <(jq -S . lib/deploy/cluster-zone.golden.json) <(jq -S . deplo-agent/internal/server/testdata/cluster-zone.golden.json) || {
              echo "::error::lib/deploy/cluster-zone.golden.json differs from deplo-agent's internal/server/testdata/cluster-zone.golden.json"
              exit 1
            }
          fi
          # The location table this repo's release builds (ADR-0049 phase 2), as the agent reads it.
          if [ -f deplo-agent/internal/dnszone/testdata/geo-table.golden.bin ]; then
            cmp lib/geo/geo-table.golden.bin deplo-agent/internal/dnszone/testdata/geo-table.golden.bin &&
              diff <(jq -S . lib/geo/geo-lookups.golden.json) <(jq -S . deplo-agent/internal/dnszone/testdata/geo-lookups.golden.json) || {
                echo "::error::lib/geo's reference location table differs from deplo-agent's internal/dnszone/testdata"
                exit 1
              }
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: deplo-agent/go.mod
          cache: false
      - name: The pinned agent accepts it
        run: |
          pin=$(jq -r .deplo.agent package.json)
          git -C deplo-agent checkout -q "v$pin"
          if ! grep -q 'func TestAnswers_thePanelsRoutesPassAsTheyAre' deplo-agent/internal/server/*_test.go; then
            echo "agent v$pin predates the answers' contract test: nothing to check against it"
            exit 0
          fi
          cp lib/deploy/answer-routes.golden.json deplo-agent/internal/server/testdata/answer-routes.golden.json
          tests='TestAnswers_thePanelsRoutesPassAsTheyAre'
          if grep -q 'func TestZone_thePanelsRequestPasses' deplo-agent/internal/server/*_test.go; then
            cp lib/deploy/cluster-zone.golden.json deplo-agent/internal/server/testdata/cluster-zone.golden.json
            tests="$tests|TestZone_thePanelsRequestPasses"
          fi
          cd deplo-agent && go test ./internal/server -run "$tests" -count=1 -v
          if grep -q 'func TestGeo_thePanelsTableParses' internal/dnszone/*_test.go; then
            cp ../lib/geo/geo-table.golden.bin ../lib/geo/geo-lookups.golden.json internal/dnszone/testdata/
            go test ./internal/dnszone -run 'TestGeo_thePanelsTableParses' -count=1 -v
          fi
        env:
          CGO_ENABLED: "0"
