name: Feature request
description: Something Deplo should be able to do and cannot
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Deplo's goal is to be **far simpler** than every other self-hosted platform, not to
        match a feature list. "another platform has this setting" is an argument against
        shipping something, not for it. The questions below are how we tell the difference.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The situation you are actually stuck in, not the feature you have in mind.
      placeholder: >
        I run four apps that share a Postgres, and when I rotate its password I have to
        edit four sets of environment variables by hand and redeploy each one.
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Who is this for?
      description: >
        Deplo has exactly two audiences. Something that cannot say which one it serves is
        not designed yet.
      options:
        - Everyone. It should be on by default and need no configuration.
        - Experts. It belongs behind an Advanced affordance, off by default.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you work around it today?
      description: If the workaround is a shell on the server, say so. That is exactly what Deplo is meant to remove.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What else did you consider?
      description: Optional, but a smaller thing that covers the same need is often the one that ships.
