"""
A command run inside one container of an App or a Database, on a cron schedule, in the job's own timezone. Running it produces a CronRun.
"""
type CronJob {
  appId: ID
  command: String
  createdAt: String
  databaseId: ID
  description: String
  enabled: Boolean

  """
  The NAMES of the job's extra variables. The values are write-only and have no read path.
  """
  envKeys: [String!]
  id: ID
  keepRuns: Int
  lastRunAt: String
  lastStatus: String

  """
  The last time it actually worked. Separate from lastRunAt so a job quietly skipped for a week (its container is stopped) is visible.
  """
  lastSuccessAt: String

  """Launches per scheduled fire. 1 means no retry."""
  maxAttempts: Int
  name: String

  """Computed, never stored. Null while the job is disabled."""
  nextRunAt: String

  """skip | allow - what happens when the previous run is still going."""
  overlap: String

  """5-field cron."""
  schedule: String

  """
  Compose service to run in. Null means the target's own container - the only possibility for a database. Never a container name: a redeploy mints new ones, so it is resolved live before every attempt.
  """
  service: String

  """sh | bash."""
  shell: String

  """app | database."""
  targetKind: String

  """
  Per ATTEMPT - it is the agent's exec deadline. timeout x attempts is capped at 24 hours.
  """
  timeoutSeconds: Int

  """IANA zone the schedule is read in. NOT UTC unless you say so."""
  timezone: String
  updatedAt: String
  user: String
  workdir: String
}

"""
One extra variable for a job. The value is encrypted at rest and reaches the host inside the mTLS RPC - it is never readable back.
"""
input CronJobEnvInput {
  key: String!
  value: String!
}

"""
Every field is optional so one input serves create and edit; create requires name, schedule and command.
"""
input CronJobInput {
  command: String
  description: String
  enabled: Boolean

  """Replaces the job's variables wholesale when present."""
  env: [CronJobEnvInput!]

  """10 to 500."""
  keepRuns: Int

  """1 to 4. 1 means no retry."""
  maxAttempts: Int
  name: String

  """skip | allow."""
  overlap: String

  """5-field cron."""
  schedule: String

  """Empty ⇒ the target's own container."""
  service: String

  """sh | bash."""
  shell: String

  """Per attempt, 1s to 24h."""
  timeoutSeconds: Int

  """IANA zone, e.g. Europe/Rome."""
  timezone: String
  user: String
  workdir: String
}

