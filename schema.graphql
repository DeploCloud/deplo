"""
The instance-wide Docker cleanup schedule. One policy, not one per server: a host opts OUT via `excludedServerIds`, so a newly added server cannot silently go un-swept. Until it is saved once it reads as the defaults (ENABLED, daily at 04:00 UTC, every scope), so a fresh install sweeps its hosts without anyone finding this setting first; a saved row (including an explicit disable) always wins.
"""
type DockerCleanupPolicy {
  enabled: Boolean

  """
  Servers the SCHEDULED sweep skips. A manual runDockerCleanupNow ignores this list - the operator standing in front of the button has already made that decision.
  """
  excludedServerIds: [String!]

  """
  unused_app_images only: how many of the newest images to keep for an app that CANNOT be rolled back - a compose stack, a prebuilt image, a pull request preview. An app Deplo builds is governed by its own `App.rollbackKeep` instead, which the sweep sends per app.
  """
  keepImagesPerApp: Int

  """Only reclaim objects older than this. 0 = no age filter."""
  minAgeHours: Int

  """
  5-field cron expression, evaluated in UTC. Rejected on save if it does not parse.
  """
  schedule: String

  """
  What the sweep reclaims. Empty = nothing, and the policy cannot be enabled.
  """
  scopes: [DockerCleanupScope!]

  """Null until the policy has been saved once."""
  updatedAt: String
}

"""
One executed sweep on one server. A run that could not even start (an unprovisioned host, an agent offline or too old) is still recorded, as `failed`: the history never lies about an attempt.
"""
type DockerCleanupRun {
  """The user who ran it, or "Scheduler" for a scheduled sweep."""
  actor: String
  error: String
  finishedAt: String
  id: ID

  """The per-scope breakdown, in the scope allow-list's order."""
  items: [DockerCleanupRunItem!]
  reclaimedBytes: Float

  """
  Null once the server is removed - `serverName` is what keeps the row readable.
  """
  serverId: ID
  serverName: String
  startedAt: String
  status: DockerCleanupRunStatus
  trigger: DockerCleanupTrigger
}

"""
One scope's outcome in an executed run. Counts only - the history keeps how much was reclaimed, not which objects.
"""
type DockerCleanupRunItem {
  error: String
  itemsRemoved: Int
  reclaimedBytes: Float
  scope: DockerCleanupScope
  skipped: Boolean
}

enum DockerCleanupRunStatus {
  failed
  running
  success
}

"""
A class of Docker object a cleanup may reclaim. build_cache = the daemon's BuildKit cache. dangling_images = untagged layers (never `-a`). orphan_buildkit_cache = dangling volumes proven to be abandoned buildkitd stores. unused_app_images = old app images no container references, bounded per app by that app's `rollbackKeep` (falling back to keepImagesPerApp where a rollback is impossible). Deplo pushes to no registry, so a removed image comes back only by a rebuild - the newest image per app always survives. leftover_app_files = the config files of Apps and databases that were DELETED, judged against the stacks this instance still knows about; the only scope that removes something no rebuild recreates, so it is skipped outright on an agent too old to have the list. leftover_networks = the Docker networks of Environments and previews that are gone, judged against the same kind of list; it reclaims address space rather than disk. All are on by default.
"""
enum DockerCleanupScope {
  build_cache
  dangling_images
  leftover_app_files
  leftover_networks
  orphan_buildkit_cache
  unused_app_images
}

enum DockerCleanupTrigger {
  manual
  scheduled
}

"""A routable hostname attached to an app (Traefik router)."""
type Domain {
  appId: ID
  appSlug: String

  """
  How this domain's TLS certificate is issued. Set to `cloudflare` automatically when a DNS check finds the host proxied and it still had no certificate - Cloudflare already serves it over HTTPS. `custom` serves it over HTTPS from a certificate installed on the owning server (see `addServerCertificate`) and asks no ACME provider for one. Null on rows written before the field existed (they route as `letsencrypt`).
  """
  certProvider: CertProvider
  createdAt: String
  entrypoint: DomainEntrypoint
  id: ID

  """
  The hostname this domain REPLACED on the platform the app was imported from, or null when it is the address the app always had. An import cannot keep the source's own throwaway host (it carries that server's IP) nor a name another team here already serves, so the route is re-hosted onto an address Deplo mints - this is what the app's Domains section reads to say which address became which. Cleared by `dismissImportedDomains`.
  """
  importedFrom: String
  middlewares: [String!]
  name: String
  pathPrefix: String
  port: Int
  primary: Boolean

  """
  The owner's declaration that a proxy (a CDN, a reverse proxy, a load balancer) answers for this hostname. Its A records then name the proxy, never this server, so the DNS check can only ever settle `misconfigured` - this is what keeps the host routed anyway, and makes its URL https (the proxy terminates TLS). The declared twin of the `cloudflare` status, which is detected from Cloudflare's published ranges.
  """
  proxied: Boolean

  """
  Hostname this domain answers a permanent 301 to (the canonical half of its www / non-www pair), or null when it serves the app itself.
  """
  redirectTo: String
  service: String
  serviceName: String
  source: String
  ssl: Boolean

  """
  DNS verification state. Only `valid` is confirmed: `cloudflare` means the host is proxied and its origin cannot be checked from DNS, so it is routed but unverified. A `misconfigured` host is off the router unless `proxied` declares another proxy answers for it. See the DomainStatus enum.
  """
  status: DomainStatus
  stripPrefix: Boolean
}

"""
Per-domain routing config; an omitted certProvider means no certificate (plain HTTP), unless the add-time DNS check finds the host proxied through Cloudflare, then it is stored as `cloudflare`.
"""
input DomainConfigInput {
  certProvider: CertProvider
  entrypoint: DomainEntrypoint
  middlewares: [String!]
  pathPrefix: String
  port: Int
  proxied: Boolean
  service: String
  stripPrefix: Boolean
  www: DomainWwwRedirect
}

enum DomainEntrypoint {
  web
  websecure
}

"""
Partial domain edit; only the provided fields are changed. Null clears an override.
"""
input DomainPatchInput {
  certProvider: CertProvider
  entrypoint: DomainEntrypoint
  middlewares: [String!]
  name: String
  pathPrefix: String
  port: Int
  proxied: Boolean
  service: String
  stripPrefix: Boolean
  www: DomainWwwRedirect
}

"""A custom domain's DNS verification state."""
enum DomainStatus {
  """
  Proxied through Cloudflare's orange-cloud. UNVERIFIED - treat as an open question, not a success. The host resolves to Cloudflare's anycast IPs, which are shared by every proxied domain on the internet and mask the origin, so public DNS can show only that the domain is proxied, never whether Cloudflare forwards it to this app's server or to somebody else's. The domain is routed regardless (it must be, or a correct setup could never work), but nothing has been confirmed.
  """
  cloudflare

  """A check failed unexpectedly (reserved)."""
  error

  """
  Resolves to an address that is neither this app's server nor a Cloudflare edge. Not routed, unless `Domain.proxied` says another proxy answers for it.
  """
  misconfigured

  """
  No A record resolves yet - the normal state of a record just created. Re-checked automatically.
  """
  pending

  """
  An A record resolves straight to this app's server: confirmed, and routed.
  """
  valid
}

"""
Which half of a www / non-www pair serves the app, relative to this domain. `toThis`: the counterpart hostname redirects here. `toCounterpart`: this hostname redirects to its counterpart, which serves the app. `none`: no pair.
"""
enum DomainWwwRedirect {
  none
  toCounterpart
  toThis
}

