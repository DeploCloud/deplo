"""
What an app's containers are ACTUALLY doing on the host, read live from the owning agent. `App.status` only records the last thing the control plane asked for (deploy / start / stop), so it keeps saying 'active' for an app that has been crash-looping since its deploy succeeded.
"""
type AppRuntime {
  containers: [RuntimeContainer!]

  """
  Declared services with NO container on the host — the failure the running/total counts cannot see, because a container that was never created is not there to be counted as stopped.
  """
  missing: [String!]
  restarting: Int
  running: Int
  total: Int

  """
  Containers that are running and failing their own healthcheck — up, listening, and broken.
  """
  unhealthy: Int

  """The agent did not answer: the counts are unknown, not zero."""
  unreachable: Boolean
}

"""
A shared variable as seen from one app. `linked` is the explicit opt-in (the only thing that injects — ADR-0012); `inScope`/`scope` say whether an availability scope suggests it here.
"""
type AppSharedVar {
  id: ID

  """
  An availability scope (team-wide / environment / project) covers this app.
