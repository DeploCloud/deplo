"""
An ephemeral deploy of one App for one open pull request, running as its own stack `deplo-<slug>__pr-<n>` with its own URL. Not an App and not an Environment.
"""
type AppPreview {
  appId: ID

  """
  A fork's pull request only builds once a member with `deploy` approves it.
  """
  approved: Boolean
  approvedSha: String
  author: String
  baseBranch: String
  closed: Boolean
  createdAt: String
  headBranch: String
  headRepo: String
  host: String
  id: ID

  """
  The head lives in a repository the operator does not control, so its code is untrusted and it never receives secret-typed variables.
  """
  isFork: Boolean
  latestDeploymentId: ID
  prNumber: Int
  pullRequestUrl: String

  """blocked | queued | building | active | error | idle."""
  status: String
  title: String
  updatedAt: String
  url: String
}

input AppPreviewSettingsInput {
  """Rebuild a preview when its pull request gets a new commit."""
  autoDeploy: Boolean

  """
  e.g. `preview.example.com`, with a wildcard DNS record pointing here. Empty clears it back to the zero-configuration nip.io default.
  """
  baseDomain: String

  """Build a pull request that is still a draft."""
  buildDrafts: Boolean

  """Post the preview URL as a comment on the pull request."""
  comment: Boolean
  enabled: Boolean

  """deny | approve | allow."""
  forkPolicy: String

  """Serve previews over HTTPS. Needs a preview domain."""
  https: Boolean
  maxActive: Int

  """Container port. Empty ⇒ the app's build port."""
  port: Int

  """Newline-separated labels a pull request must carry. Empty ⇒ no filter."""
  requiredLabels: String

  """Where previews run. Empty ⇒ the app's own server."""
  serverId: String
  ttlDays: Int
}

"""
Everything the Pull requests page renders in one read: whether previews can work at all, the branch they watch, the app's settings, and the previews.
"""
type AppPreviewsView {
  appId: ID
  autoDeploy: Boolean
  baseDomain: String

  """Pull requests must target this branch to get a preview."""
  branch: String
  buildDrafts: Boolean
  comment: Boolean
  enabled: Boolean
  forkPolicy: String
  githubSettingsUrl: String
  https: Boolean
  maxActive: Int
  port: Int
  previews: [AppPreview!]
  requiredLabels: [String!]
  serverId: String
  ttlDays: Int

  """
  null ⇒ previews work. Otherwise the ONE reason they cannot: not-github | no-installation | app-needs-update | disabled.
  """
  unavailable: String
}

"""
What an app's containers are ACTUALLY doing on the host, read live from the owning agent. `App.status` only records the last thing the control plane asked for (deploy / start / stop), so it keeps saying 'active' for an app that has been crash-looping since its deploy succeeded.
"""
type AppRuntime {
  containers: [RuntimeContainer!]

  """
  Declared services with NO container on the host - the failure the running/total counts cannot see, because a container that was never created is not there to be counted as stopped.
  """
  missing: [String!]
  restarting: Int
  running: Int
  total: Int

  """
  Containers that are running and failing their own healthcheck - up, listening, and broken.
  """
  unhealthy: Int

  """The agent did not answer: the counts are unknown, not zero."""
  unreachable: Boolean
}

"""
A shared variable as seen from one app. `linked` is the explicit opt-in (the only thing that injects - ADR-0012); `inScope`/`scope` say whether an availability scope suggests it here.
"""
type AppSharedVar {
  """It lands here with no link and cannot be removed from this app."""
  autoInject: Boolean
  id: ID

  """An availability scope (team / environment / project) covers this app."""
  inScope: Boolean
  key: String

  """The app opted in - the var injects on its next deploy."""
  linked: Boolean
  masked: Boolean

  """The team behind an auto-injected variable."""
  ownerTeamName: String

  """The most specific covering scope: teamWide | environment | project."""
  scope: String
  targets: [EnvTarget!]
  type: EnvVarType
  updatedAt: String
  updatedBy: VarAuthor

  """Masked for secrets, like SharedVar.value."""
  value: String
}

