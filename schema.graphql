  setAppBuildServer(buildFallbackLocal: Boolean, buildServerId: String, id: String!): App

  """
  Set (or clear, with null) the extra flags appended to this app's `docker compose up`. Rejects anything that isn't a plain flag, and any flag that would choose the project, stack file or env-file.
  """
  setAppComposeUpArgs(id: String!, value: String): App

  """
  Turn this app's deploy hook on or off. Off ⇒ the endpoint refuses every call, whatever URL or API token it carries.
  """
  setAppDeployHookEnabled(id: String!, value: Boolean!): App

  """
  Replace an app's whole env set from the .env editor (upsert the given entries, delete the rest). New vars default to plain; existing secrets are left untouched. Returns the resulting variable count.
  """
  setAppEnv(appId: String!, defaultTargets: [EnvTarget!], entries: [EnvEntryInput!]!): Int

  """
  Correct the framework Deplo recognised in this app's source (a catalog id such as "vite"), or pass null to go back to trusting detection. The correction survives every later deploy's re-detection.
  """
  setAppFramework(framework: String, id: String!): App

  """
  Replace the host ports an app publishes. Needs the publish-ports grant, and is refused for a compose stack, which publishes its own.
  """
  setAppPorts(id: String!, ports: [PublishedPortInput!]!): App

  """Turn pull request previews on or off, and set their options."""
  setAppPreviewSettings(appId: ID!, input: AppPreviewSettingsInput!): Boolean

  """
  How many previous deployments this app can be rolled back to (0-20, default 3). It is retention: the app's server keeps this many of its images behind the running one. Takes effect on the next sweep - lowering it removes nothing now, and raising it cannot bring back images already removed.
  """
  setAppRollbackKeep(count: Int!, id: String!): App

  """
  Replace an app's volumes (named, app-files, and host bind mounts). Compose-stack apps included - each volume names the service it mounts into.
  """
  setAppVolumes(id: String!, volumes: [VolumeInput!]!): App

  """
  Point every manageable server's certificates at this account email, where Let's Encrypt sends expiry and revocation notices. Each host's proxy is recreated to pick it up, one host at a time, so routing there is interrupted for a few seconds; certificates already issued keep working. Servers Deplo cannot manage are skipped and reported as skipped, never counted as done.
  """
  setCertificateEmail(email: String!): [CertificateAccount!]

  """
  Turn the container console on or off for one app. Off closes the attach sessions already open and hides the console everywhere.
  """
  setConsoleEnabled(appId: String!, enabled: Boolean!): Boolean

  """
  Turn cron jobs on or off for one target. Off stops the schedule and keeps the jobs; runs already in flight are left to finish.
  """
  setCronEnabled(
    enabled: Boolean!
    targetId: ID!

    """app | database."""
    targetKind: String!
  ): Boolean

  """
  Replace the database's config files (whole set - an omitted file is removed) and APPLY them: the files are written next to the stack and the container is recreated, unlike the image/command overrides beside them. A path inside the engine's data directory is refused.
  """
  setDatabaseMounts(id: String!, mounts: [DatabaseMountInput!]!): Database
  setDatabaseRunning(id: String!, running: Boolean!): Database

  """Make an environment the project's default (unsets the previous one)."""
  setDefaultEnvironment(id: ID!): Boolean

  """
  Set the git branch an environment builds from (empty ⇒ the app's default branch).
  """
  setEnvironmentBranch(branch: String!, id: ID!): Boolean

  """
  Set a folder's accent colour (hex, e.g. #3b82f6), or clear it back to the default when color is omitted/null.
  """
  setFolderColor(color: String, id: ID!): Boolean

  """
  Grant (or replace) a user's capabilities on a folder. Bounded by both the granter's and the grantee's caps; owner/admin only. Returns the fresh grant list.
  """
  setFolderGrant(capabilities: [String!]!, folderId: ID!, userId: ID!): [FolderGrant!]

  """
  Turn Gravatar profile pictures on or off for the whole instance. On, a person with no uploaded picture falls back to the one registered against their address, and each VIEWER's browser fetches it - the panel itself never dials out, so an instance with no egress still works. Off, no Gravatar address is emitted anywhere and nothing about anybody leaves the instance. Instance-wide because it is a property of this deployment's egress and policy, not of one team's taste.
  """
  setGravatarEnabled(enabled: Boolean!): InstanceSettings

  """
  Set how far back the log viewer's time range may reach, in days. It is a ceiling on the ranges the picker offers, not a retention policy: docker rotates a container's logs by SIZE, so nothing here makes a host hold more of them, and a window that comes back empty says the host rotated them rather than pretending the app was quiet. Clamped rather than rejected - the field is a number input with the same bounds, so a value outside them arrived from an API client, and the honest answer to "keep 900 days" is the ceiling.
  """
  setLogMaxDays(days: Int!): InstanceSettings

  """Turn MCP access on or off for this team."""
  setMcpSettings(enabled: Boolean!): McpSettings

  """
  Set one member's role and per-node overrides in the ACTIVE team. The team is the caller's own - there is no id to pass, which is what keeps it from reaching another one.
  """
  setMemberAccess(input: SetMemberAccessInput!): [UserTeamAccess!]

  """
  Point Deplo at where a machine of this panel really is, and remember it for the next attempt. The address is PROVED first - the agent must answer there, over the same pinned certificate - and only then written down, because a remembered address is used automatically and an unproven one would turn a single bad guess into a permanent one. Returns a warning to surface, or null. The source server row is removed at the end of every migration, which is why this is remembered against the SOURCE rather than against that row.
  """
  setMigrationMachineAddress(
    address: String!
    serverId: String!

    """
    The panel's own machine id. Empty string for the host the panel itself runs on.
    """
    sourceId: String!
    url: String!
  ): String

  """
  Serve the panel over https, or over plain http. Turning it off is for a panel whose address cannot get a certificate - it does not resolve publicly yet, :80 is closed, the box is internal - where https means a browser warning on a page nobody has logged into yet. Three things move together: the route goes to the :80 entrypoint (with that entrypoint's redirect pinned below it), the stored panel address takes the new scheme, and the session cookie drops its `__Secure-` prefix, without which the panel would load over http and be impossible to log into. The host's proxy is recreated to pick it up, so sites on that server - this panel included - are unreachable for the few seconds it takes to come back. On a Deplo installed before it published its own route, the first change ADOPTS that route: Deplo writes one beside the container labels the installer left and outranks them, after proving from inside the network that it knows where the panel listens.
  """
  setPanelHttps(enabled: Boolean!): PanelHttps

  """
  Set the address this Deplo answers on, or pass no url to fall back to DEPLO_PUBLIC_URL. A bare domain becomes https://. The value is validated as a hostname with no path, no credentials and no shell metacharacters, because it is interpolated into copy-and-run strings such as a server's install command. On a Deplo that publishes itself through its own proxy this MOVES the panel's route too, and puts the old one back if the new address does not answer; DNS still has to point at the server first.
  """
  setPanelUrl(url: String): InstanceSettings

  """
  Set a preview-only override for one variable (advanced). It outranks the app's own value and any shared variable, in previews only.
  """
  setPreviewEnvVar(appId: ID!, key: String!, secret: Boolean, value: String!): Boolean

  """Make this domain its app's primary (canonical) host. Returns true."""
  setPrimaryDomain(id: String!): Boolean

  """
  Set a Project container's accent colour (hex), or clear it when color is omitted/null.
  """
  setProjectColor(color: String, id: ID!): Boolean

  """
  Turn saving server metrics on the control plane on or off. Turning it off also drops the buffered history.
  """
  setSaveMetrics(enabled: Boolean!): MonitoringSettings

  """
  Include ONE server in the scheduled sweep, or leave it out, without touching any other host's membership. This is what a server's own Cleanup tab writes: sending the whole exclusion list from a per-host page would rewrite every other host from a stale snapshot. Manual `runDockerCleanupNow` ignores the list either way.
  """
  setServerCleanupExcluded(excluded: Boolean!, serverId: String!): DockerCleanupPolicy

  """
  Set how many deployments this server runs at once (the per-server slot count the deploy queue enforces). 1 = strict serialization. Whole number in [1, 50].
  """
  setServerDeployConcurrency(concurrency: Int!, id: String!): Server

  """
  Change what a server is for: "everything", "build" or "storage". Leaving "everything" is refused while the host still has apps or databases on it. A server INSTALLED as backups-only has no Docker and stays pinned to "storage" until its install command is re-run on the host. "import" is not settable and a migration source is not convertible: the install command is the way in and the way out.
  """
  setServerRole(id: String!, role: String!): Server

  """
  Set a server's team access. allTeams: true makes it available to every team; false restricts it to teamIds. Blocked (clear error) when a team that still has apps or databases on the server would lose access.
  """
  setServerTeams(input: SetServerTeamsInput!): Server

  """
  Set the host clock's timezone to an IANA zone name (e.g. "Europe/Rome"). Changes the wall-clock LABEL, not the instant: nothing restarts, and Deplo's own schedules (backups, cleanup) stay on UTC. Aliases are accepted and canonicalised ("US/Eastern" is stored as "America/New_York"); a bare UTC offset is not a zone and is refused. Returns a fresh reading of the host, so the moved clock is visible without a second call. The agent rejects a zone the host does not carry.
  """
  setServerTimezone(id: String!, timezone: String!): ServerHostInfo

  """
  Publish Traefik's own web dashboard for this server on a domain, protected by basic auth, or turn it off by passing no input. A domain, a username and a password are ALL required to enable it - the dashboard lists every route, service and certificate on the host, so it is never published unprotected. On an edit that only changes the domain the stored password is reused; the password itself can never be read back. Applying the change recreates the Traefik container, so routing on this host is interrupted for a few seconds.
  """
  setServerTraefikDashboard(id: String!, input: TraefikDashboardInput): Server

  """Link or unlink a shared variable to one app. Returns true."""
  setSharedVarAppLink(appId: String!, linked: Boolean!, varId: String!): Boolean

  """
  Set one person's role and per-node overrides in one team. Whole-set replace: node grants not sent are removed.
  """
  setUserTeamAccess(input: SetUserTeamAccessInput!): [UserTeamAccess!]
  startApp(id: String!): App

  """
  Begin the GitHub App manifest flow; returns the form's POST target, manifest and signed state.
  """
  startGithubConnect(
    org: String

    """
    In-app path to send the browser back to once the App is installed. Anything that is not a plain in-app route is ignored, and the flow ends on Settings → Git as before.
    """
    returnTo: String
  ): GithubConnectStart

  """
  Start a migration and hand it to the control plane. Returns the run id as soon as the plan is DURABLE, not when the migration is done: the loop lives here now, under the identity of whoever started it, so the tab can be closed, reloaded or replaced and the run does not notice. The panel's token is stored encrypted for the length of the run and wiped the moment it leaves `running` - a deliberate reversal of never storing it, made because the alternative is a migration that cannot survive a page reload.
  """
  startMigration(input: MigrationSourceInput!, orgName: String, servers: [MigrationServerChoiceInput!], targets: [MigrationRunTargetInput!]!): String

  """
  Options for `navigator.credentials.create`. Requires the account password.
  """
  startPasskeyRegistration(password: String!): JSON

  """
  Mint a TOTP secret and recovery codes. Requires the account password. Refused when two-factor is already on.
  """
  startTwoFactorEnrolment(password: String!): TwoFactorEnrolment

  """
  Accept that the data a migration could not copy is not coming, and let this database start again: clears `dataCopyError`. The engine will initialise an EMPTY database on the volume, which is exactly what the refusal exists to stop - so this is a decision, not a retry. Recorded in Activity.
  """
  startWithoutMigratedData(id: String!): Database
  stopApp(id: String!): App

  """
  Close a run somebody stopped part-way, WITHOUT finishing it - the migration sources keep their agents, because re-running is how a stopped migration is resumed.
  """
  stopMigration(runId: String!): Boolean

  """Register this browser for push alerts in the active team."""
  subscribeWebPush(auth: String!, endpoint: String!, p256dh: String!): Boolean

  """Switch the active team (sets a cookie server-side). Returns true."""
  switchTeam(teamId: String!): Boolean

  """
  Probe the destination through its agent - for a bucket, head/write/remove; for a server, resolve the folder, check it is writable and report its free space, and return BOTH the repainted destination and the verdict. A failed probe resolves normally with `report.ok = false`: check it rather than assuming success, and show `report.error` verbatim.
  """
  testDestination(id: String!): DestinationTestResult

  """
  Re-probe EVERY destination in the active team and return them with their badges repainted, newest first. For pickers that must show live connectivity the moment they open, rather than a status that was true hours ago. A destination whose probe fails comes back as `error` with `lastTestError` set - the call itself still resolves.
  """
  testDestinations: [BackupDestination!]

  """
  Ask the provider who the stored token belongs to and record the answer.
  """
  testGitConnection(id: String!): GitConnection

  """Send a one-off test alert through one channel, using its saved config."""
  testNotificationChannel(id: ID!): Boolean

  """Enable or disable a backup schedule. Returns true."""
  toggleBackup(enabled: Boolean!, id: String!): Boolean

  """
  Hand this app over to another team the viewer belongs to. The app keeps running: it leaves its folder/project, loses its shared-variable links and backup schedules, and keeps its GitHub connection only if the destination team has its own installation on that account. Returns true.
  """
  transferAppToTeam(appId: String!, teamId: String!): Boolean

  """
  Hand instance ownership to another instance admin. Owner-only; requires the caller's password. Returns true.
  """
  transferInstanceOwner(password: String!, userId: String!): Boolean

  """
  Hand the active team to another member, who is put on the Owner role with the whole team in reach as part of the same write. Primary-owner only; requires the caller's password, plus a two-factor code when their account has 2FA on. Returns true.
  """
  transferTeamOwnership(code: String, password: String!, userId: String!): Boolean

  """
  Take Deplo off a MIGRATION SOURCE: uninstall the agent from the host (systemd unit, binary, state dir - never Docker), then forget the server. Only a server whose role is "import" - an ordinary server is removed with removeServer, which is trust revocation and leaves the host alone. `removed: false` means the host still has the agent on it and the server row was KEPT; `uninstallCommand` is returned either way, because an unreachable or de-trusted host will always need the host-side path. A registration whose install command was never run has nothing to uninstall and is simply forgotten.
  """
  uninstallServerAgent(id: String!): ServerUninstall

  """Forget this browser's push registration."""
  unsubscribeWebPush(endpoint: String!): Boolean
  updateAppBuild(build: BuildConfigInput!, id: String!): App

  """
  Save the app's health check, or send no input to turn it off. Applied on the next deploy, because the block is baked into the rendered compose. Refused for a compose stack: that YAML is its author's, and a `healthcheck:` written there is the one that runs.
  """
  updateAppHealthCheck(id: String!, input: HealthCheckInput): App
  updateAppLogo(id: String!, logo: String): App

  """
  Save the app's per-app resource caps (RAM/CPU/PIDs/disk/…). Applied on the next deploy. A cleared field ⇒ that dimension is uncapped.
  """
  updateAppResources(id: String!, limits: ResourceLimitsInput!): App
  updateAppSource(id: String!, input: UpdateSourceInput!): App

  """
  Edit a backup schedule's name, destination, cron and retention. The target it backs up is fixed at creation and cannot be changed. Returns true.
  """
  updateBackup(id: String!, input: UpdateBackupInput!): Boolean

  """
  Change a basic-auth user's password. The new password is live on every domain of the app within seconds (the old one stops working).
  """
  updateBasicAuthUserPassword(id: String!, password: String!): BasicAuthUser
  updateCronJob(id: ID!, input: CronJobInput!): CronJob

  """
  Edit a database's public exposure (publish/unpublish + host port) and, optionally, the server it runs on. An in-place edit re-renders the compose and reroutes the container on its current host (data volume preserved). A server change recreates the container on the new host, COPIES its data volume there host-to-host (relayed through the control plane, not via S3) so the data follows the move, then tears down the old host's stack. The copy runs with both stacks stopped and rolls back on failure (the DB stays put). The connection string is re-derived. Everything else is create-only. The publish-ports grant is enforced in the data layer when exposure is on.
  """
  updateDatabase(id: String!, input: UpdateDatabaseInput!): Database

  """
  Save the database's expert overrides: custom image, custom command, and/or engine version (image tag). Applied on the next redeploy. An absent field is left unchanged; an explicit null clears the override.
  """
  updateDatabaseImage(id: String!, input: UpdateDatabaseImageInput!): Database

  """
  Set the database's display logo (an image data-URI), or clear it with null to fall back to the engine's own brand mark. Cosmetic only.
  """
  updateDatabaseLogo(id: String!, logo: String): Database

  """
  Save the database's per-container resource limits. Applied on the next redeploy or settings-driven reroute.
  """
  updateDatabaseResources(id: String!, limits: ResourceLimitsInput!): Database

  """
  Save the instance-wide cleanup policy. The cron is rejected (not repaired) when it does not parse - an unparseable schedule is a cleanup that silently never runs while the UI says it is enabled. The numeric bounds are clamped instead: there is no dangerous value of 'keep N images', only an unhelpful one.
  """
  updateDockerCleanupPolicy(input: UpdateDockerCleanupPolicyInput!): DockerCleanupPolicy

  """
  Apply a full edit to a domain and return the updated domain (reloaded).
  """
  updateDomain(id: String!, patch: DomainPatchInput!): Domain

  """
  Change the current user's email after re-checking their password. Returns true.
  """
  updateEmail(currentPassword: String!, email: String!): Boolean

  """Rename a git connection or rotate its token."""
  updateGitConnection(id: String!, input: UpdateGitConnectionInput!): GitConnection

  """Change a member's role and/or capabilities."""
  updateMember(input: UpdateMemberInput!): Member

  """
  Set the current user's picture SOURCE: a base64 image data-URI (png/jpeg/webp, downscaled to 256x256 by the browser as a convenience - the size and grammar are enforced here), `<style>:<preset>:<seed>` for a generated picture (`pixelbot` faces, `initials` monograms), `gravatar`, or `initials` for the monogram. Null or empty clears the choice, which falls back to their Gravatar (when the instance allows it) and then to a face seeded with their id. Returns true.
  """
  updateMyAvatar(image: String): Boolean

  """
  Update the current user's display name, and their handle when one is given. The handle is the instance-wide public username: lowercase letters, numbers, - and _, 3-32 characters, unique. Returns true.
  """
  updateProfile(name: String!, username: String): Boolean

  """
  Rename and/or re-scope a role. Every member holding it gets the new capability set immediately. Returns true.
  """
  updateRole(input: UpdateRoleInput!): Boolean

  """
  Rewrite where Deplo dials this server's agent - the migration verb for a host whose IP changed. Unless `force`, the agent must answer at the new address (same pinned certificate) before anything is saved. Returns a warning to surface, or null.
  """
  updateServerAddress(
    address: String!
    agentPort: Int
    force: Boolean
    id: String!

    """
    Write only where Deplo dials, keeping the address the server was registered at. The migration wizard's flag: a panel behind a proxy hands out the proxy's address, and the import still has to recognise the machine by the one it came from.
    """
    keepHost: Boolean
  ): String

  """
  Update this server's agent binary in place to the latest released version WITHOUT reissuing its certificates - the agent self-updates over its existing pinned-mTLS channel and re-execs keeping the same on-disk trust materials, so the server stays online with the same identity. Returns the version the agent is now running. Errors clearly when the server is unreachable/unprovisioned, or, until the agent ships the self-update RPC, when its agent is too old to update itself remotely (re-run the installer to upgrade it for now).
  """
  updateServerAgent(id: String!): String
  updateTeam(input: UpdateTeamInput!): Team

  """
  Set or clear the active team's picture. Same gate as renaming the team, because it IS the same action - how the team presents itself. The value is a base64 image data-URI (png/jpeg/webp); null or empty removes it and falls back to the two-letter monogram.
  """
  updateTeamAvatar(image: String): Team

  """
  Change a token's name, permissions or project scope. The secret is unchanged, so tightening a live token costs no rotation. Returns true.
  """
  updateToken(input: UpdateTokenInput!): Boolean

  """Edit a user's instance-admin flag, suspended state, and password."""
  updateUserAdmin(input: UpdateUserAdminInput!): UserDetail

  """Create or update an env var, then return the stored entity."""
  upsertEnv(input: UpsertEnvInput!): EnvVar

  """
  Re-check the domain's DNS and (re)issue its certificate. A check that finds the host proxied through Cloudflare also moves a certificate-less domain onto the `cloudflare` provider.
  """
  verifyDomain(id: String!): Domain

  """
  Finish a passkey sign-in with what the authenticator produced. Sets the session cookie.
  """
  verifyPasskeyLogin(response: JSON!): AuthPayload

  """
  Finish a login that returned `requiresTwoFactor`, with a TOTP code or a recovery code.
  """
  verifyTwoFactorLogin(code: String!, recoveryCode: Boolean): AuthPayload

  """Write the file a File storage entry points at. Answers its path."""
  writeAppFile(appId: String!, content: String!, path: String!): String
}

"""
One capability set, applied to every node named here. Send several to give different nodes different sets.
"""
input NodeGrantInput {
  appIds: [String!]
  capabilities: [Capability!]!
  folderIds: [String!]
  projectIds: [String!]
}

"""
What moving the panel to a given address would break, counted live and instance-wide. Every number is a fact about right now, so a dialog can name what is lost instead of warning in the abstract. Read-only: nothing here changes anything.
"""
type PanelAddressImpact {
  currentUrl: String
  deployHooks: Int

  """
  Git connections whose webhook is registered against the address the INSTALLER was given, not this setting - so this change does not move them.
  """
  gitConnections: Int
  githubApps: Int

  """
  Whether the hostname moves. Everything a browser welds to an origin - passkeys, cookies, push subscriptions - dies on this.
  """
  hostChanges: Boolean

  """
  https to http. Browsers that already loaded the panel over https keep refusing plain http on that hostname until the HSTS they remember expires.
  """
  losesHttps: Boolean
  mcpConnections: Int
  panelFallbackUrl: String
  passkeyPeople: Int
  passkeys: Int
  pendingServers: Int
  pushSubscriptions: Int
  registrationLinks: Int
  schemeChanges: Boolean
  sessionPeople: Int
  sessions: Int
  url: String
}

"""What DNS says about the address the panel answers on."""
type PanelDns {
  host: String
  resolved: [String!]
  status: String
}

"""
How the Deplo panel itself is served, read live off the router that publishes it. `unavailable` says why it is not Deplo's to change here - the host is not added as a server, its proxy is not one Deplo installed, or the panel is still published by its own container.
"""
type PanelHttps {
  """
  Whether a browser accepts the certificate this address serves. False on the generated host, which no public certificate authority issues for, so the browser warns once. Null when it could not be read, which is not the same as untrusted.
  """
  certificateTrusted: Boolean

  """The host the panel's route answers on, as the proxy has it."""
  domain: String

  """
  Whether the panel is served over https. False means plain http on :80, and it is an advanced opt-out: the only case for it is a panel no certificate can be issued for, on a network Let's Encrypt cannot reach.
  """
  enabled: Boolean

  """
  The generated host the panel also answers on, or null when that IS the address above.
  """
  fallbackDomain: String

  """
  The certificate resolver it is ordered from, named as this host names it. Null when https is off, or when this host orders from nobody and serves a certificate you installed.
  """
  provider: String
  unavailable: String
}

"""
