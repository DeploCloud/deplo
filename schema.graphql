"""One scheduled fire of a cron job, retries included."""
type CronRun {
  actor: String

  """0-based. The output below is this attempt's, not the first's."""
  attempt: Int
  command: String
  container: String

  """Why it failed or was skipped. Not command output."""
  error: String
  exitCode: Int
  finishedAt: String
  id: ID
  jobId: ID
  maxAttempts: Int

  """Running, but waiting out a retry backoff rather than executing."""
  retrying: Boolean
  scheduledFor: String
  startedAt: String

  """
  running | succeeded | failed | timedout | skipped | lost. `skipped` never started (the container was stopped, or the previous run was still going) and `lost` means the outcome is unknown - the agent restarted mid-run. Neither is a failure.
  """
  status: String
  stderr: String

  """Last 16 KiB - the tail."""
  stdout: String

  """schedule | manual."""
  trigger: String
}

