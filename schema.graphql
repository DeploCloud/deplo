"""
Live resource usage for ONE container of an app/database stack - the Monitoring tab's per-container breakdown. net_* / block_* are cumulative byte counters since the container started.
"""
type ContainerInstanceMetrics {
  blockRead: Float
  blockWrite: Float
  cpu: Float

  """
  The healthcheck verdict when the image defines one: healthy | unhealthy | starting. EMPTY means there is no healthcheck at all, which is not a synonym for healthy.
  """
  health: String
  memLimit: Float
  memPct: Float
  memUsed: Float
  name: String

  """
  This container is on the host's network (`network_mode: host`), so net_rx/net_tx are 0 here - its traffic is the machine's, on the server's own network chart.
  """
  netNsHost: Boolean

  """
  The container's network namespace. Two containers reporting the same one (a sidecar on `network_mode: service:x`) read the SAME counters, and the stack total counts them once. 0 from an older agent.
  """
  netNsId: Float
  netRx: Float
  netTx: Float
  pids: Int

  """
  How many times docker has restarted this container - what tells a container that is starting from one that has been dying for an hour.
  """
  restartCount: Int
  running: Boolean

  """
  Raw docker state: running | restarting | exited | created | paused | dead | removing. Empty from an agent too old to report it.
  """
  state: String
}

