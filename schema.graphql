"""
A team API token. Only the prefix is ever exposed - the raw token is shown once at creation and only its hash is persisted.
"""
type ApiToken {
  """Individually-named apps in the scope."""
  appIds: [String!]

  """
  What this token itself may do. Its effective power is this set intersected with what its creator can still do in the team, so a token can never outlive the access of the member who minted it.
  """
  capabilities: [String!]
  createdAt: String
  createdByAvatarColor: String

  """
  That member's resolved picture, so a token names them the way every other screen does.
  """
  createdByAvatarUrl: String

  """The member this token acts as, and is clamped to."""
  createdByUsername: String

  """
  Whether the expiry above has passed. Answered by the server, so a client with a wrong clock cannot disagree about whether a credential still works.
  """
  expired: Boolean

  """
  When this token stops working. Null means never, which is what a token minted before expiries existed still is. An expired token resolves to nothing everywhere - the API, MCP and deploy hooks alike.
  """
  expiresAt: String

  """
  Whole folders in the scope: every app in them and in the folders nested under them. Most apps live in a folder, so this is usually the level a scope is drawn at.
  """
  folderIds: [String!]

  """
  The team this token is MANAGED from, where it was created. Any team it reaches can revoke it; only this one can change it.
  """
  homeTeamId: ID

  """That team's name, for a list that spans teams."""
  homeTeamName: String
  id: ID

  """
  The token may administer the whole instance (users, servers and the global environment), not just its team. Mutually exclusive with a project scope.
  """
  instanceAdmin: Boolean
  lastUsedAt: String

  """
  Whether this credential drives Deplo over MCP: minted by approving an OAuth consent, or a bearer token that has already called the MCP server. The question a company asks is which of its tokens an AI agent holds, and either shape answers yes.
  """
  mcp: Boolean
  name: String

  """
  Set when this token was minted by connecting an AI client over OAuth rather than from the tokens page. Such a token is also listed under Settings → MCP Server, and `updateToken` re-authors it like any other: the client sees the new permissions on its next call.
  """
  oauthClientName: String
  prefix: String

  """
  Whole projects in the scope: every app in them, now and later. Naming one narrows the token inside that team, so the team-wide permissions it holds (managing members, roles, databases) stop applying there.
  """
  projectIds: [String!]

  """
  Whether this token is limited at all. False means every team its creator belongs to, and everything in it.
  """
  scoped: Boolean

  """Whole teams in the scope: every project and every app in them."""
  teamIds: [String!]
}

"""A deployable application owned by a team."""
type App {
  autoDeploy: Boolean

  """
  Build on this app's own server when the build server cannot be reached, saying so in the deploy log. True by default. False fails the deploy instead, for whoever chose a small deploy server on purpose.
  """
  buildFallbackLocal: Boolean

  """
  The server that BUILDS this app's image, when that is not `serverId`. Null is Automatic: a build-only server if the fleet has one this team can reach and its architecture matches, otherwise build where the app runs. Setting it to `serverId` means 'always build on this app's own server'. Ignored by a compose stack and a docker-image source, neither of which Deplo builds.
  """
  buildServerId: ID
  compose: String

  """
  Extra flags this app appends to the `docker compose up` that brings it up, or null for the untouched command. Additive only - the flags that choose the project, stack file or env-file are refused.
  """
  composeUpArgs: String
  createdAt: String

  """
  Why this app's data did not arrive, when a migration tried to copy it and could not. Empty for every app that was never migrated and every copy that worked. While it is set, deploying and starting this app are refused - its volumes are empty or half written - and `deployWithoutMigratedData` is how someone accepts that and unblocks it.
  """
  dataCopyError: String

  """
  Whether this app's deploy hook answers. The hook URL itself is never a field - read it back with revealAppDeployHook.
  """
  deployHookEnabled: Boolean

  """
  The app's most recent deployments, newest first (capped so a nested query can't fan out over the whole history + per-deployment logs).
  """
  deployments: [Deployment!]
  dockerImage: String
  domainCount: Int
  folderId: ID

  """
  The JavaScript framework backing this app ("nextjs", "astro", "nestjs", …), or null when none was found or the app doesn't build with one of the auto-detecting builders (Nixpacks / Railpack). Detected on every deploy, unless setAppFramework has corrected it - in which case that choice is what this returns.
  """
  framework: String

  """
  What the LAST DEPLOY actually read from the source, ignoring any correction. Equals `framework` unless the user overrode it.
  """
  frameworkDetected: String

  """
  The health check baked into this app's compose, or null when it has none.
  """
  healthCheck: HealthCheck
  id: ID
  latestDeployment: Deployment
  logo: String
  name: String

  """
  Host ports this app publishes. Empty for a compose stack, which publishes its own in its compose file.
  """
  ports: [PublishedPort!]
  productionUrl: String

  """The Project container this app belongs to, if any."""
  projectId: ID

  """
  Per-app resource caps applied at deploy time, or null when the app has no limits set.
  """
  resources: ResourceLimits

  """
  How many previous deployments this app can be rolled back to (0-20, default 3). Retention: its server keeps this many of the app's images behind the running one. 0 means there is nothing to go back to.
  """
  rollbackKeep: Int
  serverId: ID
  slug: String
  source: DeploySource
  status: AppStatus
  teamId: ID
  updatedAt: String

  """Persistent volumes mounted into this app."""
  volumes: [Volume!]
}

