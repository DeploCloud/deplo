  rotateDatabasePassword(id: String!, password: String): String

  """Run an ad-hoc backup of an app now (no owning schedule). Returns true."""
  runAppBackup(appId: String!, destinationId: String!): Boolean

  """Run a backup schedule manually now. Returns true."""
  runBackup(id: String!): Boolean

  """
  Run a job now, outside its schedule. Ignores the overlap setting - somebody just asked for it explicitly.
  """
  runCronJobNow(id: ID!): CronRun

  """
  Run an ad-hoc backup of a database now (no owning schedule). Returns true.
  """
  runDatabaseBackup(databaseId: String!, destinationId: String!): Boolean

  """
  START a sweep of this server now, with the policy's scopes - whether or not the schedule is enabled, and ignoring the exclusion list (which only governs the scheduled sweep). Returns IMMEDIATELY with the `running` run: the host keeps working in the background, so the caller never waits on a `docker rmi` sweep and closing the page cannot cancel it. Follow it on the `dockerCleanupRuns` subscription (or re-read the query); whatever the host fails at (unreachable, unprovisioned, an agent too old) lands on that run as `failed` with the reason. Only pre-flight problems error here: unknown server, nothing selected to reclaim, or a sweep already running on this host. Allow-listed: it never prunes containers, volumes or networks, so a stopped app, its data and its network survive.
  """
  runDockerCleanupNow(serverId: String!): DockerCleanupRun

  """Create a channel (omit id) or replace one. Returns the saved channel."""
  saveNotificationChannel(id: ID, input: JSON!): JSON

  """Create or update a shared variable; returns the saved entity."""
  saveSharedVar(input: SaveSharedVarInput!): SharedVar

  """
  Read a source panel and describe what an import would do. Works out which product it is when `kind` is omitted. Writes NOTHING, here or there. The per-service detail calls happen now, not at import time, so the preview can already say which hostname belongs to another team, which compose file needs a grant you do not hold, and what has no equivalent here.
  """
  scanMigrationSource(input: MigrationSourceInput!): MigrationPlan

  """
  Read the Let's Encrypt account email off every server's proxy, live. Per host, because the address is a flag in each host's own stack file and a fleet installed over time can genuinely disagree with itself. A host Deplo cannot manage reports why instead of an address.
  """
  serverCertificateAccounts: [CertificateAccount!]

  """
  List the TLS certificates installed on this server by hand, read live from its proxy. Deplo keeps no copy of them, so this is what the host is actually serving. Errors when Deplo did not install the proxy there.
  """
  serverCertificates(id: String!): [ServerCertificate!]
  setAppAutoDeploy(id: String!, value: Boolean!): App

  """
  Choose which server BUILDS this app. Null buildServerId is Automatic (a build-only server if the fleet has one this team can reach and its architecture matches, otherwise build where the app runs); passing the app's own server id means 'always build here'. buildFallbackLocal decides what happens when the build server is unreachable: build on the app's own server (the default) or fail the deploy. Changing either never starts a deploy.
