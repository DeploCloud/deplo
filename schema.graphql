type Subscription {
  """
  Emits the app whenever its status (power / deployment) changes. Fires once immediately with the current snapshot, then on every change.
  """
  appStatus(slug: String!): App

  """
  Emits the database whenever its status changes (provisioning → running, start/stop, redeploy, …). Fires once immediately with the current snapshot, then on every change; ends when the database is deleted.
  """
  databaseStatus(id: String!): Database

  """
  Emits the whole cleanup history whenever it changes — a sweep started, finished, or was pruned. Fires once immediately with the current snapshot. Instance-wide: there is no per-server stream, because there is one policy and one shared fleet.
