}

"""
A registered user matched by username/display name when adding members.
"""
type UserSearchResult {
  avatarColor: String

  """
  Resolved profile picture: uploaded image, else Gravatar, else null for the monogram.
  """
  avatarUrl: String
  name: String
  teamAvatarUrl: String
  teamName: String
  userId: ID
  username: String
}

"""
A browser or client currently signed in to the viewer's account. Carries no credential - a session is addressed by its id, never by its token.
"""
type UserSession {
  """
  The client half of `label`, e.g. "Chrome". Null when the user agent matched nothing.
  """
  browser: String
  createdAt: String

  """
  This is the session making the request. It cannot be revoked from here; sign out instead.
  """
  current: Boolean
  device: DeviceKind
  expiresAt: String
  id: ID
  ipAddress: String

  """Human description, e.g. "Chrome on macOS"."""
  label: String

  """
  When the session was last refreshed, which stands in for last used. Accurate to about 15 minutes.
  """
  lastSeenAt: String

  """The platform half of `label`, e.g. "macOS" or "iPhone"."""
  os: String
}

"""What one person can do in one team, as an instance admin sets it."""
type UserTeamAccess {
  """
  The set on the membership - their own when they hold one, else their role's.
  """
  baseCapabilities: [Capability!]

  """That set is theirs, so saving their role no longer rewrites it."""
  customCapabilities: Boolean

  """
  Their reach IS the nodes below: they touch those and nothing else, whatever their role reaches. Stored as the admin's choice, so deleting the last granted node doesn't silently turn it off.
  """
  granular: Boolean

  """
  The team's primary owner. Their access can't be changed by anyone, instance admins included.
  """
  isFounder: Boolean
  nodes: [AccessNodeGrant!]

  """`owner` outranks everyone; anything else ranks as a member."""
  rank: String
  roleId: ID
  roleName: String
  teamId: ID
  teamName: String
}

input UserTeamInput {
  roleId: String
  teamId: String!
  userId: String!
}

"""
The user who created or last modified a variable. Identity only, never an email.
"""
type VarAuthor {
  avatarColor: String

  """
  Resolved profile picture: uploaded image, else Gravatar, else null for the monogram. Derived server-side, so the address itself never travels.
  """
  avatarUrl: String
  id: ID
  name: String
  username: String
}

"""The authenticated principal for the current request."""
type Viewer {
  avatarColor: String

  """
  Resolved profile picture: uploaded image, else Gravatar, else null for the monogram.
  """
  avatarUrl: String
  email: String
  id: ID
  isInstanceAdmin: Boolean
  name: String
  role: String

  """
  Whether this account has a verified second factor. Says only that one exists, never anything about it.
  """
  twoFactorEnabled: Boolean
  username: String
}

"""
A persistent volume mounted into an app - a docker named volume, an app-files bind, or a host bind mount.
"""
type Volume {
  hostPath: String
  id: ID
  mountPath: String
  name: String
  projectPath: String
  propagation: MountPropagation
  readOnly: Boolean
  service: String
  type: String
}

"""A persistent volume mounted into an app."""
input VolumeInput {
  hostPath: String
  id: String
  mountPath: String!
  name: String
  projectPath: String
  propagation: MountPropagation
  readOnly: Boolean
  service: String
  type: String
}
