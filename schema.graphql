"""
A team API token. Only the prefix is ever exposed — the raw token is shown once at creation and only its hash is persisted.
"""
type ApiToken {
  """Individually-named apps in the scope."""
  appIds: [String!]

  """
  What this token itself may do. Its effective power is this set intersected with what its creator can still do in the team, so a token can never outlive the access of the member who minted it.
  """
  capabilities: [String!]
  createdAt: String

  """The member this token acts as, and is clamped to."""
  createdByUsername: String

  """
  Whole folders in the scope: every app in them and in the folders nested under them. Most apps live in a folder, so this is usually the level a scope is drawn at.
  """
  folderIds: [String!]

  """
  The team this token is MANAGED from — where it was created. Any team it reaches can revoke it; only this one can change it.
  """
  homeTeamId: ID
  id: ID

  """
  The token may administer the whole instance — users, servers and the global environment — not just its team. Mutually exclusive with a project scope.
  """
  instanceAdmin: Boolean
  lastUsedAt: String
  name: String
  prefix: String

  """
  Whole projects in the scope: every app in them, now and later. Naming one narrows the token inside that team, so the team-wide permissions it holds (managing members, roles, databases) stop applying there.
  """
  projectIds: [String!]

  """
  Whether this token is limited at all. False means every team its creator belongs to, and everything in it.
  """
  scoped: Boolean

  """Whole teams in the scope: every project and every app in them."""
  teamIds: [String!]
}

"""A deployable application owned by a team."""
type App {
  autoDeploy: Boolean
  compose: String

  """
  Extra flags this app appends to the `docker compose up` that brings it up, or null for the untouched command. Additive only — the flags that choose the project, stack file or env-file are refused.
  """
  composeUpArgs: String
  createdAt: String

  """
  Whether this app's deploy hook answers. The hook URL itself is never a field — read it back with revealAppDeployHook.
  """
  deployHookEnabled: Boolean

  """
  The app's most recent deployments, newest first (capped so a nested query can't fan out over the whole history + per-deployment logs).
  """
  deployments: [Deployment!]
  dockerImage: String
  domainCount: Int
  folderId: ID

  """
  The JavaScript framework backing this app ("nextjs", "astro", "nestjs", …), or null when none was found or the app doesn't build with one of the auto-detecting builders (Nixpacks / Railpack). Detected on every deploy, unless setAppFramework has corrected it — in which case that choice is what this returns.
  """
  framework: String

  """
  What the LAST DEPLOY actually read from the source, ignoring any correction. Equals `framework` unless the user overrode it.
  """
  frameworkDetected: String
  id: ID
  latestDeployment: Deployment
  logo: String
  name: String
  productionUrl: String

  """The Project container this app belongs to, if any."""
  projectId: ID

  """
  Per-app resource caps applied at deploy time, or null when the app has no limits set.
  """
  resources: ResourceLimits
  serverId: ID
  slug: String
  source: DeploySource
  status: AppStatus
  teamId: ID
  updatedAt: String

  """Persistent volumes mounted into this app."""
  volumes: [Volume!]
}

