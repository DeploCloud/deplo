# Deplo control plane  self-deploy behind Traefik, backed by Postgres.
# On the server:
#   1. docker network create deplo            (once; shared with Traefik)
#   2. export DEPLO_DOMAIN=deplo.example.com
#      export DEPLO_SECRET=$(openssl rand -base64 32)
#      export DEPLO_DB_PASSWORD=$(openssl rand -base64 24)
#   3. docker compose up -d --build
services:
  deplo:
    # Build from this checkout, or comment out `build` to pull the published image.
    build: .
    image: ghcr.io/idradev/deplo:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DEPLO_DATA_DIR=/data
      - DEPLO_SECRET=${DEPLO_SECRET:?set DEPLO_SECRET}
      - DEPLO_PUBLIC_URL=https://${DEPLO_DOMAIN:?set DEPLO_DOMAIN}
      - DEPLO_DATABASE_URL=postgres://deplo:${DEPLO_DB_PASSWORD:?set DEPLO_DB_PASSWORD}@postgres:5432/deplo
    # Published even though Traefik serves the domain: http://<server-ip>:3000 is
    # the panel's IP address, the way back in when its domain stopped working.
    # Nothing can add this port later without recreating the container by hand.
    ports:
      - "3000:3000"
    # NO docker.sock, the same rule install.sh states: the panel is the one
    # container here reachable from the internet, and that mount is root on the
    # box for whoever reaches it. Nothing needs it any more — the last live line
    # that touched a socket went with `ensureNetwork` (see lib/deploy/build.ts),
    # and the plugin retirement sweep tolerates an unreachable daemon by design.
    # Everything host-coupled goes over mTLS gRPC to the server agent, ADR-0006.
    volumes:
      - deplo-data:/data
    networks:
      - deplo
      - deplo-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.deplo.rule=Host(`${DEPLO_DOMAIN}`)"
      - "traefik.http.routers.deplo.entrypoints=websecure"
      - "traefik.http.routers.deplo.tls.certresolver=letsencrypt"
      # Lowest priority so this Host-only dashboard router is a true fallback:
      # any more-specific PathPrefix router on the same host — an app's path
      # override, or the reserved /plugins/<slug> route (ADR-0013) — wins. Traefik
      # defaults an un-pinned router's priority to its rule-string LENGTH, which
      # for a real host exceeds a short PathPrefix router's length and would
      # otherwise SHADOW that path. priority=1 (0 is treated as "unset").
      - "traefik.http.routers.deplo.priority=1"
      - "traefik.http.services.deplo.loadbalancer.server.port=3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=deplo
      - POSTGRES_PASSWORD=${DEPLO_DB_PASSWORD:?set DEPLO_DB_PASSWORD}
      - POSTGRES_DB=deplo
    volumes:
      - deplo-postgres:/var/lib/postgresql/data
    # NOT the shared `deplo` network. Every deployed app sits on that one, and
    # every container there can register a DNS name: a stack with a service
    # called `postgres` would round-robin the control plane's own database
    # lookups onto a container a tenant controls, which is the credential in the
    # connection string. This leg is internal (no route off the host) and holds
    # only these two.
    networks:
      - deplo-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deplo -d deplo"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host: only reachable on the internal `deplo` network.

volumes:
  deplo-data:
  deplo-postgres:

networks:
  deplo:
    external: true
  # The control plane and its database, and nothing else. `internal: true` means
  # no route off the host at all.
  deplo-internal:
    internal: true
